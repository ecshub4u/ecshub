.fi .n{flex:1;line-height:1.3}.fi small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.fcard{background:var(--card);border-radius:18px;padding:2px 14px;box-shadow:0 6px 18px rgba(60,30,90,.1)}
.back{border:0;background:none;color:var(--teal);font-size:14px;font-weight:700;padding:0 0 8px}

.semp,.hint{display:none}

.panel{position:relative}
button{cursor:pointer}

}
