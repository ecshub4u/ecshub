    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, 'Lucida Grande', Arial, Ubuntu, Cantarell, 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      background: var(--bg-sidebar);
      transition: background .25s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg-sidebar);
    }

    .scroll {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .scroll::-webkit-scrollbar {
      width: 8px;
    }

    .scroll::-webkit-scrollbar-thumb {
      background: rgba(127, 127, 127, .3);
      border-radius: 8px;
    }

    .scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ---------- Motion ---------- */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(26px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-26px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .anim-right {
      animation: slideInRight .3s var(--ease);
      will-change: transform, opacity;
    }

    .anim-left {
      animation: slideInLeft .3s var(--ease);
      will-change: transform, opacity;
    }

    .anim-fade {
      animation: fadeIn .32s var(--ease);
      will-change: opacity;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 420px;
      min-width: 320px;
      max-width: 460px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .sidebar-header {
      min-height: 64px;
      padding: 10px 16px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .02);
      position: relative;
      z-index: 2;
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(155deg, var(--wa-green), var(--wa-green-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .brand-text {
      flex: 1;
      min-width: 0;
    }

    .brand-text .brand-title {
      margin: 0;
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.2px;
      color: var(--wa-green-dark);
      line-height: 1.2;
    }

    .brand-text .brand-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    body.dark .brand-text .brand-title {
      color: #06cf9c;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
      background: transparent;
      border: none;
      font-size: 17px;
      transition: background .15s var(--ease), transform .12s var(--ease), color .2s;
      touch-action: manipulation;
    }

    .icon-btn:hover {
      background: rgba(127, 127, 127, .14);
    }

    .icon-btn:active {
      transform: scale(.9);
    }

    .sidebar-header-text {
      flex: 1;
      min-width: 0;
    }

    .sidebar-header-text .sh-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-header-text .sh-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-sidebar);
      transition: background .25s var(--ease);
    }

    .sidebar-footer {
      padding: 8px 14px;
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--divider-color);
      background: var(--bg-header);
      transition: background .25s var(--ease), color .25s var(--ease);
    }



    .list-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background .12s var(--ease), transform .1s var(--ease);
      border-bottom: 1px solid var(--divider-color);
      touch-action: manipulation;
    }

    .list-row:hover {
      background: var(--hover-bg);
    }

    .list-row:active {
      transform: scale(.99);
    }

    .list-row.row-active {
      background: var(--active-bg);
      border-left: 3px solid var(--wa-green);
      padding-left: 13px;
    }

    .row-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--wa-green-tint);
      color: var(--wa-green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
    }

    .avatar-wrap {
      position: relative;
      display: inline-flex;
      flex-shrink: 0;
    }

    .new-dot-badge {
      position: absolute;
      top: -1px;
      right: -1px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--wa-green);
      border: 2.5px solid var(--bg-sidebar);
    }

    .doc-icon .new-dot-badge {
      border-color: var(--bg-chat);
      top: -3px;
      right: -3px;
    }

    .new-pill {
      display: inline-block;
      background: var(--wa-green);
      color: #fff;
      font-size: 9.5px;
      font-weight: 700;
      padding: 1.5px 6px;
      border-radius: 999px;
      margin-left: 6px;
      letter-spacing: .3px;
      vertical-align: middle;
    }

    .row-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .row-avatar.avatar-brand {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .row-body {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-size: 15.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .row-sub .done-tag {
      color: var(--wa-green-dark);
      font-weight: 600;
    }

    .row-chevron {
      color: var(--chevron-color);
      font-size: 14px;
      flex-shrink: 0;
    }

    .empty-list-msg {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .empty-list-msg i {
      font-size: 34px;
      color: var(--chevron-color);
      display: block;
      margin-bottom: 12px;
    }

    /* ---------- Chat / right panel ---------- */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      min-width: 0;
      position: relative;
      transition: background .25s var(--ease);
    }

    .chat-header {
      min-height: 64px;
      padding: 8px 16px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    /* ---------- In-app PDF viewer ---------- */
    .pdf-viewer-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      flex-direction: column;
      background: var(--bg-chat);
    }

    .pdf-viewer-overlay.is-open {
      display: flex;
    }

    .pdf-viewer-header {
      min-height: 58px;
      padding: 8px 8px 8px 12px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .pdf-viewer-title {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pdf-viewer-body {
      flex: 1;
      min-height: 0;
      background: #525659;
    }

    .pdf-viewer-body iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #525659;
    }

    .file-viewer-image-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b1b1b;
      touch-action: none;
      position: relative;
    }

    .file-viewer-image-wrap .zoom-content {
      display: inline-block;
      transform-origin: 0 0;
    }

    .file-viewer-image-wrap img {
      display: block;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .file-viewer-text {
      margin: 0;
      height: 100%;
      overflow: auto;
      box-sizing: border-box;
      padding: 18px 20px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.6;
      color: #e8e8e8;
      background: #1e1e1e;
    }

    .file-viewer-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 13.5px;
      text-align: center;
      padding: 0 24px;
    }

    .pdf-canvas-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #525659;
      touch-action: none;
      position: relative;
    }

    .pdf-canvas-wrap .zoom-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0 28px;
      box-sizing: border-box;
      transform-origin: 0 0;
      width: 100%;
    }

    .pdf-page-canvas {
      margin-bottom: 10px;
      max-width: calc(100% - 20px);
      height: auto;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .35);
    }

    .zoom-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font-size: 11.5px;
      padding: 5px 12px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s var(--ease);
      white-space: nowrap;
    }

    .zoom-hint.is-visible {
      opacity: 1;
    }

    .chat-back-btn {
      display: none;
    }

    .chat-header-title {
      font-size: 16.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-progress-track {
      height: 3px;
      background: var(--track-color);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
      width: 100%;
      max-width: 220px;
    }

    .chat-progress-fill {
      height: 100%;
      background: var(--wa-green);
      border-radius: 2px;
      transition: width .35s var(--ease);
    }

    .breadcrumb-bar {
      padding: 9px 16px;
      background: var(--breadcrumb-bg);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      z-index: 2;
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .crumb {
      color: var(--wa-green-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s;
      touch-action: manipulation;
    }

    .crumb:hover {
      text-decoration: underline;
    }

    .crumb.current {
      color: var(--text-primary);
      font-weight: 600;
      cursor: default;
    }

    .crumb.current:hover {
      text-decoration: none;
    }

    .crumb-sep {
      color: var(--chevron-color);
    }

    .up-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--wa-green-dark);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-right: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      touch-action: manipulation;
      transition: background .15s var(--ease), transform .1s var(--ease);
    }

    .up-btn:hover {
      background: rgba(0, 168, 132, .12);
    }

    .up-btn:active {
      transform: scale(.95);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 6% 30px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background-color: var(--bg-chat);
      background-image: var(--doodle-url);
      background-repeat: repeat;
      transition: background-color .25s var(--ease);
    }

    .doc-bubble {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 480px;
      width: fit-content;
      min-width: 260px;
      cursor: pointer;
      animation: slideUp .38s var(--ease) both;
      transition: box-shadow .18s var(--ease), transform .12s var(--ease), background .25s var(--ease);
      touch-action: manipulation;
    }

    .doc-bubble:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .doc-bubble:active {
      transform: translateY(0) scale(.99);
    }

    .doc-icon {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      position: relative;
    }

    .doc-info {
      flex: 1;
      min-width: 0;
    }

    .doc-name {
      font-size: 14.5px;
      color: var(--text-primary);
      font-weight: 500;
      line-height: 1.32;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-meta {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .doc-action {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 15px;
      transition: .18s var(--ease);
    }

    .doc-bubble:hover .doc-action {
      color: #fff;
      background: var(--wa-green);
    }

    .folder-bubble .doc-icon {
      background: rgba(134, 150, 160, .16);
      color: var(--folder-color);
    }

    .read-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--chevron-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: transparent;
      cursor: pointer;
      transition: all .18s var(--ease);
    }

    .read-badge:hover {
      border-color: var(--wa-green);
      transform: scale(1.15);
    }

    .read-badge.is-read {
      background: var(--wa-green);
      border-color: var(--wa-green);
      color: #fff;
    }

    .section-empty {
      margin: auto;
      text-align: center;
      color: var(--text-secondary);
      background: var(--bg-card);
      opacity: .9;
      border-radius: var(--radius-lg);
      padding: 34px 30px;
      font-size: 14px;
      animation: fadeIn .3s var(--ease);
    }

    .section-empty i {
      font-size: 30px;
      color: var(--chevron-color);
      display: block;
      margin-bottom: 10px;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 40px;
      background: #f0eee9;
      animation: fadeIn .4s var(--ease);
      transition: background .25s var(--ease);
    }

    body.dark .chat-empty {
      background: var(--bg-header);
    }

    .chat-empty .ce-icon {
      width: 110px;
      height: 110px;
      min-width: 110px;
      min-height: 110px;
      max-width: 110px;
      max-height: 110px;
      flex-shrink: 0;
      flex-grow: 0;
      box-sizing: border-box;
      border-radius: 50%;
      background: #e7f8f3;
      color: var(--wa-green);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .chat-empty .ce-icon i {
      font-size: 46px;
      line-height: 1;
    }

    .chat-empty .ce-title {
      font-size: 27px;
      font-weight: 300;
      color: var(--text-primary);
      margin: 0;
    }

    .chat-empty .ce-sub {
      max-width: 420px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .chat-empty .ce-note {
      margin-top: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--wa-green-dark);
      background: #e7f8f3;
      padding: 8px 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* ---------- Mobile ---------- */
    @media (max-width:767px) {
      .sidebar {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .chat-empty .ce-icon {
        width: 90px;
        height: 90px;
        min-width: 90px;
        min-height: 90px;
        max-width: 90px;
        max-height: 90px;
      }

      .chat-empty .ce-icon i {
        font-size: 38px;
      }

      .chat-empty .ce-title {
        font-size: 22px;
      }

      .chat-empty .ce-sub {
        font-size: 13px;
      }

      .chat-empty .ce-note {
        font-size: 11.5px;
      }

      #app.chat-open .sidebar {
        display: none;
      }

      #app.chat-open .chat {
        display: flex;
      }

      .chat-back-btn {
        display: flex;
      }

      .chat-body {
        padding: 14px 4% 24px;
      }

      .doc-bubble {
        max-width: 100%;
        min-width: 0;
      }

      .brand-text .brand-title {
        font-size: 17px;
      }
    }

    @media (min-width:768px) and (max-width:1024px) {
      .sidebar {
        width: 340px;
      }
    }

    /* ---------- ECSHub Intro — WhatsApp-style splash (logo only) ---------- */
    .ecshub-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-sidebar);
      color: var(--text-primary);
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity .6s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0s linear 0s;
    }

    .ecshub-splash.is-hiding {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .6s cubic-bezier(0.22, 1, 0.36, 1),
                  visibility 0s linear .6s;
    }

    .ecshub-splash-logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      opacity: 0;
      transform: scale(.92);
      animation: ecshubLogoIn .8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: opacity .18s ease;
    }

    .ecshub-splash-credit {
      position: absolute;
      bottom: max(32px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .2px;
      color: var(--text-secondary);
      opacity: 0;
      animation: ecshubFadeIn .6s cubic-bezier(0.22, 1, 0.36, 1) .5s forwards;
      transition: opacity .18s ease;
    }

    /* Step 1 of hiding: kill the logo/credit fast so nothing ghosts
       over the real content while the solid backdrop is still fading.
       Step 2 (.is-hiding) then fades the now-empty backdrop away. */
    .ecshub-splash.content-hide .ecshub-splash-logo,
    .ecshub-splash.content-hide .ecshub-splash-credit {
      animation: none !important;
      opacity: 0 !important;
    }

    @keyframes ecshubLogoIn {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes ecshubFadeIn {
      to { opacity: 1; }
    }

    @media (max-width:767px) {
      .ecshub-splash-logo {
        width: 78px;
        height: 78px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ecshub-splash-logo,
      .ecshub-splash-credit {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }






    /* ---------- Global Search ---------- */
    .global-search { padding:10px 14px; background:var(--bg-sidebar); border-bottom:1px solid var(--divider-color); position:relative; }
    .global-search-wrap { display:flex; align-items:center; gap:9px; background:var(--hover-bg); border-radius:9px; padding:0 12px; min-height:40px; }
    .global-search-wrap i { color:var(--text-secondary); }

    /* ---------- Install App banner ---------- */
    .install-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin: 8px 12px;
      background: var(--wa-green-tint);
      border-radius: var(--radius-md);
      border: 1px solid rgba(0, 168, 132, .18);
    }

    .install-banner.is-visible {
      display: flex;
      animation: popIn .3s var(--ease) both;
    }

    .install-banner-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--wa-green);
      color: #fff;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .install-banner-text {
      flex: 1;
      min-width: 0;
    }

    .install-banner-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .install-banner-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .install-banner-btn {
      flex-shrink: 0;
      background: var(--wa-green);
      color: #fff;
      border: none;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: filter .15s var(--ease);
    }

    .install-banner-btn:hover {
      filter: brightness(1.05);
    }

    .install-banner-close {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

    /* =========================================================
       PERSISTENCE (per-device, this browser only)
       ========================================================= */
    function safeGet(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable, ignore */ }
    }
    function getProgress() { return safeGet('ecshub_progress', {}); }
    function isRead(path) { return !!getProgress()[path]; }
    function markRead(path) {
      const m = getProgress();
      if (!m[path]) { m[path] = true; safeSet('ecshub_progress', m); }
    }
    function toggleRead(path) {
      const m = getProgress();
      if (m[path]) delete m[path]; else m[path] = true;
      safeSet('ecshub_progress', m);
    }
    function collectFilePaths(node, prefix) {
      let out = [];
      for (const [k, v] of Object.entries(node)) {
        if (k === "type") continue;
        if (typeof v === "object") out = out.concat(collectFilePaths(v, [...prefix, k]));
        else out.push([...prefix, k].join("/"));
      }
      return out;
    }
    function subjectProgress(year, sem, key, subjectObj) {
      const paths = collectFilePaths(subjectObj.files || {}, [year, sem, key]);
      const progress = getProgress();
      const done = paths.filter(p => progress[p]).length;
      return { done, total: paths.length };
    }

    /* ---------- "New" file tracking ----------
       No server timestamps exist per file, so newness is inferred by
       comparing today's full file list against the list saved on the
       visitor's last visit. Anything that wasn't there before is "new"
       until the visitor opens it. First-ever visit never flags
       anything (so a fresh visitor doesn't see the whole site tagged
       new). */
    function allFilePathsInTree() {
      let out = [];
      Object.keys(fileTree).forEach(year => {
        Object.keys(fileTree[year]).forEach(sem => {
          Object.keys(fileTree[year][sem]).forEach(subjectKey => {
            out = out.concat(collectFilePaths(fileTree[year][sem][subjectKey].files || {}, [year, sem, subjectKey]));
          });
        });
      });
      return out;
    }
    let NEW_FILES_SET = new Set();
    function initNewFilesTracking() {
      const current = allFilePathsInTree();
      const knownRaw = safeGet('ecshub_known_files', null);
      if (knownRaw === null) {
        safeSet('ecshub_known_files', current);
        safeSet('ecshub_new_files', []);
        NEW_FILES_SET = new Set();
        return;
      }
      const knownSet = new Set(knownRaw);
      const currentSet = new Set(current);
      const diff = current.filter(p => !knownSet.has(p));
      const stillNew = new Set(safeGet('ecshub_new_files', []).filter(p => currentSet.has(p)));
      diff.forEach(p => stillNew.add(p));
      safeSet('ecshub_new_files', Array.from(stillNew));
      safeSet('ecshub_known_files', current);
      NEW_FILES_SET = stillNew;
    }
    function isNewFile(path) { return NEW_FILES_SET.has(path); }
    function clearNewFlag(path) {
      if (NEW_FILES_SET.delete(path)) safeSet('ecshub_new_files', Array.from(NEW_FILES_SET));
    }
    function subjectHasNew(year, sem, key) {
      return collectFilePaths(fileTree[year][sem][key].files || {}, [year, sem, key]).some(p => NEW_FILES_SET.has(p));
    }
    function semHasNew(year, sem) {
      return Object.keys(fileTree[year][sem]).some(key => subjectHasNew(year, sem, key));
    }
    function yearHasNew(year) {
      return Object.keys(fileTree[year]).some(sem => semHasNew(year, sem));
    }

    /* ---------- Theme ---------- */
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      safeSet('ecshub_theme', dark ? 'dark' : 'light');
    }
    function toggleTheme() {
      applyTheme(!document.body.classList.contains('dark'));
      renderSidebar();
      renderChat();
    }

    /* =========================================================
       BROWSER BACK/FORWARD SUPPORT
       Every in-app navigation (year/sem/subject/folder, opening or
       closing the mobile chat view) pushes a history entry, so the
       device/browser back button steps back through the app instead
       of leaving the site entirely.
       ========================================================= */
    let suppressHistoryPush = false;

    function currentStateSnapshot() {
      return {
        sidebarLevel, sidebarYear, sidebarSem,
        chat: chatCtx ? { year: chatCtx.year, sem: chatCtx.sem, subjectKey: chatCtx.subjectKey, path: chatCtx.path.slice() } : null,
        mobileChatOpen: el.app.classList.contains('chat-open')
      };
    }

    function pushHistoryState() {
      if (suppressHistoryPush) return;
      try { history.pushState(currentStateSnapshot(), ''); } catch (e) { /* ignore if History API unavailable */ }
    }

    function applyStateSnapshot(state) {
      if (!state) {
        sidebarLevel = "years"; sidebarYear = null; sidebarSem = null;
        chatCtx = null;
        el.app.classList.remove("chat-open");
        renderSidebar();
        renderChat();
        return;
      }
      sidebarLevel = state.sidebarLevel;
      sidebarYear = state.sidebarYear;
      sidebarSem = state.sidebarSem;
      if (state.chat) {
        const { year, sem, subjectKey, path } = state.chat;
        const subjectObj = fileTree[year] && fileTree[year][sem] && fileTree[year][sem][subjectKey];
        chatCtx = subjectObj ? { year, sem, subjectKey, subjectObj, path: path.slice() } : null;
      } else {
        chatCtx = null;
      }
      renderSidebar();
      renderChat();
      if (state.mobileChatOpen) el.app.classList.add("chat-open");
      else el.app.classList.remove("chat-open");
    }

    window.addEventListener('popstate', (e) => {
      suppressHistoryPush = true;
      applyStateSnapshot(e.state);
      suppressHistoryPush = false;
    });
    function themeBtnHtml() {
      const dark = document.body.classList.contains('dark');
      return `<button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode"><i class="fa-solid ${dark ? 'fa-sun' : 'fa-moon'}"></i></button>`;
    }
    (function initTheme() {
      // Always defaults to light mode, regardless of the visitor's system
      // preference. Dark mode only turns on if they explicitly chose it
      // before (via the toggle), remembered per-browser.
      const saved = safeGet('ecshub_theme', null);
      if (saved === 'dark') document.body.classList.add('dark');
    })();

    /* =========================================================
       STATE
       ========================================================= */
    let sidebarLevel = "years";   // years | sems | subjects
    let sidebarYear = null;
    let sidebarSem = null;
    let chatCtx = null;           // { year, sem, subjectKey, subjectObj, path:[] }
    const LEVEL_DEPTH = { years: 0, sems: 1, subjects: 2 };
    let lastSidebarDepth = 0;
    let lastChatDepth = -1; // -1 = empty state

    const el = {
      app: document.getElementById("app"),
      sidebarHeader: document.getElementById("sidebarHeader"),
      sidebarList: document.getElementById("sidebarList"),
      chatHeaderWrap: document.getElementById("chatHeaderWrap"),
      chatArea: document.getElementById("chatArea")
    };

    /* =========================================================
       HELPERS
       ========================================================= */
    function semRoman(k) { return k.replace(/sem/i, "").trim().toUpperCase(); }
    function semLabel(k) { return "Semester " + semRoman(k); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function escJs(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }
    const SMALL_WORDS = new Set(['for', 'of', 'and', 'in', 'with', 'to', 'the', 'a', 'an', 'on', 'or']);
    function prettyName(s) {
      const str = String(s);
      const letters = str.replace(/[^A-Za-z]/g, '');
      const isShouty = letters.length > 3 && letters === letters.toUpperCase();
      if (!isShouty) return str;
      return str.toLowerCase().split(' ').map((w, i) => {
        if (w === '') return w;
        if (i > 0 && SMALL_WORDS.has(w)) return w;
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(' ');
    }
    const AVATAR_PALETTE = [
      { bg: '#e7f8f3', fg: '#008069', dbg: 'rgba(6,207,156,.16)', dfg: '#06cf9c' },
      { bg: '#e8f0fe', fg: '#3860c7', dbg: 'rgba(96,140,255,.16)', dfg: '#8fb0ff' },
      { bg: '#fdeee8', fg: '#c2560f', dbg: 'rgba(255,138,80,.16)', dfg: '#ffab7a' },
      { bg: '#f3e8fd', fg: '#7a3fc4', dbg: 'rgba(180,120,255,.16)', dfg: '#c9a3ff' },
      { bg: '#fff4de', fg: '#b3790a', dbg: 'rgba(255,196,64,.16)', dfg: '#ffc94b' },
    ];
    function avatarStyle(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      const c = AVATAR_PALETTE[h % AVATAR_PALETTE.length];
      const dark = document.body.classList.contains('dark');
      return dark ? `background:${c.dbg};color:${c.dfg};` : `background:${c.bg};color:${c.fg};`;
    }
    function countFiles(obj) {
      let c = 0;
      for (const [k, v] of Object.entries(obj)) {
        if (k === "type" || k === "icon") continue;
        if (typeof v === "object") c += countFiles(v);
        else c++;
      }
      return c;
    }
    function isDevicon(iconClass) { return false; }
    function iconTag(iconClass) {
      // All subject icons render in the site's standard green — no per-brand coloring.
      return `<i class="${iconClass}"></i>`;
    }
    function subjectAvatar(name, icon, hasNew) {
      const dot = hasNew ? '<span class="new-dot-badge"></span>' : '';
      if (icon === "yoga-img") {
        return `<span class="avatar-wrap"><div class="row-avatar">
      <img src="yoga.jpg" alt="${esc(name)}"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <i class="fa-solid fa-person-walking" style="display:none;font-size:19px;"></i>
    </div>${dot}</span>`;
      }
      const brandCls = isDevicon(icon) ? ' avatar-brand' : '';
      return `<span class="avatar-wrap"><div class="row-avatar${brandCls}">${iconTag(icon)}</div>${dot}</span>`;
    }
    function animateSwap(container, newDepth, lastDepth) {
      container.classList.remove('anim-right', 'anim-left', 'anim-fade');
      container.scrollTop = 0; // always start a fresh list/folder view from the top
      void container.offsetWidth; // reflow to restart animation
      if (lastDepth === -999 || newDepth === lastDepth) container.classList.add('anim-fade');
      else if (newDepth > lastDepth) container.classList.add('anim-right');
      else container.classList.add('anim-left');
    }

    /* =========================================================
       SIDEBAR RENDER
       ========================================================= */
    function renderSidebar() {
      const newDepth = LEVEL_DEPTH[sidebarLevel];

      if (sidebarLevel === "years") {
        el.sidebarHeader.innerHTML = `
      <div class="brand-logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="brand-text">
        <h1 class="brand-title">ECSHub</h1>
      </div>
      ${themeBtnHtml()}`;
        let rows = "";
        Object.keys(fileTree).forEach(year => {
          const semCount = Object.keys(fileTree[year]).length;
          rows += `
        <div class="list-row" onclick="goSemesters('${escJs(year)}')">
          <span class="avatar-wrap">
            <div class="row-avatar" style="${avatarStyle(year)}">${YEAR_ORDINAL[year] || ""}</div>
            ${yearHasNew(year) ? '<span class="new-dot-badge"></span>' : ''}
          </span>
          <div class="row-body">
            <div class="row-title">${esc(YEAR_LABELS[year] || year)}</div>
            <div class="row-sub">${semCount} semester${semCount !== 1 ? "s" : ""}</div>
          </div>
          <i class="fa-solid fa-chevron-right row-chevron"></i>
        </div>`;
        });
        el.sidebarList.innerHTML = rows;
      }

      else if (sidebarLevel === "sems") {
        el.sidebarHeader.innerHTML = `
      <button class="icon-btn" onclick="goYears()"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="sidebar-header-text">
        <div class="sh-title">${esc(YEAR_LABELS[sidebarYear] || sidebarYear)}</div>
        <div class="sh-sub">Select a semester</div>
      </div>
      ${themeBtnHtml()}`;
        let rows = "";
        Object.keys(fileTree[sidebarYear]).forEach(sem => {
          const subCount = Object.keys(fileTree[sidebarYear][sem]).length;
          rows += `
        <div class="list-row" onclick="goSubjects('${escJs(sem)}')">
          <span class="avatar-wrap">
            <div class="row-avatar" style="${avatarStyle(sem)}">${esc(semRoman(sem))}</div>
            ${semHasNew(sidebarYear, sem) ? '<span class="new-dot-badge"></span>' : ''}
          </span>
          <div class="row-body">
            <div class="row-title">${esc(semLabel(sem))}</div>
            <div class="row-sub">${subCount ? subCount + " subject" + (subCount !== 1 ? "s" : "") : "No subjects added yet"}</div>
          </div>
          <i class="fa-solid fa-chevron-right row-chevron"></i>
        </div>`;
        });
        el.sidebarList.innerHTML = rows;
      }

      else if (sidebarLevel === "subjects") {
        el.sidebarHeader.innerHTML = `
      <button class="icon-btn" onclick="goSemesters('${escJs(sidebarYear)}')"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="sidebar-header-text">
        <div class="sh-title">${esc(semLabel(sidebarSem))}</div>
        <div class="sh-sub">${esc(YEAR_LABELS[sidebarYear] || sidebarYear)}</div>
      </div>
      ${themeBtnHtml()}`;
        const subjects = fileTree[sidebarYear][sidebarSem];
        const keys = Object.keys(subjects);
        if (keys.length === 0) {
          el.sidebarList.innerHTML = `
        <div class="empty-list-msg">
          <i class="fa-regular fa-folder-open"></i>
          No subjects added yet for this semester.
        </div>`;
        } else {
          let rows = "";
          keys.forEach(key => {
            const subj = subjects[key];
            const fCount = countFiles(subj.files || {});
            const { done } = subjectProgress(sidebarYear, sidebarSem, key, subj);
            const active = chatCtx && chatCtx.year === sidebarYear && chatCtx.sem === sidebarSem && chatCtx.subjectKey === key;
            rows += `
          <div class="list-row ${active ? 'row-active' : ''}" data-year="${esc(sidebarYear)}" data-sem="${esc(sidebarSem)}" data-subject-key="${esc(key)}" onclick="openSubject('${escJs(sidebarYear)}','${escJs(sidebarSem)}','${escJs(key)}')">
            ${subjectAvatar(key, subj.icon, subjectHasNew(sidebarYear, sidebarSem, key))}
            <div class="row-body">
              <div class="row-title">${esc(prettyName(key))}</div>
              <div class="row-sub">${fCount} file${fCount !== 1 ? "s" : ""}${done > 0 ? ' · <span class="done-tag">' + done + '/' + fCount + ' done</span>' : ''}</div>
            </div>
            <i class="fa-solid fa-chevron-right row-chevron"></i>
          </div>`;
          });
          el.sidebarList.innerHTML = rows;
        }
      }

      animateSwap(el.sidebarList, newDepth, lastSidebarDepth);
      lastSidebarDepth = newDepth;
    }

    function goYears() { sidebarLevel = "years"; sidebarYear = null; sidebarSem = null; renderSidebar(); pushHistoryState(); }
    function goSemesters(year) { sidebarLevel = "sems"; sidebarYear = year; sidebarSem = null; renderSidebar(); pushHistoryState(); }
    function goSubjects(sem) { sidebarLevel = "subjects"; sidebarSem = sem; renderSidebar(); pushHistoryState(); }

    /* =========================================================
       CHAT (RIGHT PANEL) RENDER
       ========================================================= */
    function renderChat() {
      if (!chatCtx) {
        el.chatHeaderWrap.innerHTML = "";
        el.chatArea.innerHTML = `
      <div class="chat-empty">
        <div class="ce-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="ce-title">ECSHub</div>
        <div class="ce-sub">Select a subject from the left to view its syllabus, notes, previous year papers, practicals and question banks.</div>
        <div class="ce-note"><i class="fa-solid fa-lock"></i> End-to-end structured learning — no logins, no ads.</div>
      </div>`;
        lastChatDepth = -1;
        return;
      }

      const { year, sem, subjectKey, subjectObj, path } = chatCtx;
      const { done, total } = subjectProgress(year, sem, subjectKey, subjectObj);
      const pct = total ? Math.round((done / total) * 100) : 0;

      const avatarHtml = subjectObj.icon === "yoga-img"
        ? `<div class="row-avatar" style="width:40px;height:40px;">
         <img src="yoga.jpg" alt="${esc(subjectKey)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
         <i class="fa-solid fa-person-walking" style="display:none;font-size:16px;"></i>
       </div>`
        : `<div class="row-avatar${isDevicon(subjectObj.icon) ? ' avatar-brand' : ''}" style="width:40px;height:40px;font-size:16px;">${iconTag(subjectObj.icon)}</div>`;

      el.chatHeaderWrap.innerHTML = `
    <div class="chat-header">
      <button class="icon-btn chat-back-btn" onclick="closeChat()"><i class="fa-solid fa-arrow-left"></i></button>
      ${avatarHtml}
      <div style="flex:1;min-width:0;">
        <div class="chat-header-title">${esc(prettyName(subjectKey))}</div>
        <div class="chat-header-sub">${esc(YEAR_LABELS[year] || year)} • ${esc(semLabel(sem))}${total ? ' • ' + done + '/' + total + ' reviewed' : ''}</div>
        ${total ? `<div class="chat-progress-track"><div class="chat-progress-fill" style="width:${pct}%"></div></div>` : ''}
      </div>
      ${themeBtnHtml()}
    </div>
    <div class="breadcrumb-bar" id="breadcrumbBar"></div>`;

      let crumbHtml = "";
      if (path.length > 0) {
        crumbHtml += `<span class="up-btn" onclick="popPath()"><i class="fa-solid fa-arrow-turn-up" style="transform:rotate(-90deg);"></i> Back</span>`;
      }
      crumbHtml += `<span class="crumb ${path.length === 0 ? 'current' : ''}" onclick="jumpPath(0)">${esc(prettyName(subjectKey))}</span>`;
      path.forEach((p, i) => {
        const isLast = i === path.length - 1;
        crumbHtml += `<span class="crumb-sep">›</span><span class="crumb ${isLast ? 'current' : ''}" onclick="jumpPath(${i + 1})">${esc(prettyName(p))}</span>`;
      });
      document.getElementById("breadcrumbBar").innerHTML = crumbHtml;

      let node = subjectObj.files || {};
      for (const p of path) node = node[p];

      const entries = Object.entries(node).filter(([k]) => k !== "type");
      const folders = entries.filter(([, v]) => typeof v === "object");
      const files = entries.filter(([, v]) => typeof v === "string");
      const combined = [...folders, ...files];

      const newDepth = path.length + 1; // +1 so a fresh subject (depth0) differs from empty(-1)

      if (combined.length === 0) {
        el.chatArea.innerHTML = `<div class="chat-body"><div class="section-empty"><i class="fa-regular fa-folder-open"></i>No files here yet.</div></div>`;
        el.chatArea.scrollTop = 0;
        animateSwap(el.chatArea.firstElementChild, newDepth, lastChatDepth);
        lastChatDepth = newDepth;
        return;
      }

      let bubbles = "";
      combined.forEach(([name, val], idx) => {
        const delay = Math.min(idx * 40, 360);
        if (typeof val === "object") {
          const itemCount = countFiles(val);
          const folderHasNew = collectFilePaths(val, [year, sem, subjectKey, ...path, name]).some(p => NEW_FILES_SET.has(p));
          bubbles += `
        <div class="doc-bubble folder-bubble" style="animation-delay:${delay}ms" onclick="pushPath('${escJs(name)}')">
          <div class="doc-icon"><i class="fa-solid fa-folder"></i>${folderHasNew ? '<span class="new-dot-badge"></span>' : ''}</div>
          <div class="doc-info">
            <div class="doc-name">${esc(prettyName(name))}</div>
            <div class="doc-meta">${itemCount} item${itemCount !== 1 ? "s" : ""}</div>
          </div>
          <div class="doc-action"><i class="fa-solid fa-chevron-right"></i></div>
        </div>`;
        } else {
          const meta = FILE_ICONS[val] || FILE_ICONS.file;
          const fullPath = [year, sem, subjectKey, ...path, name].join("/");
          const read = isRead(fullPath);
          const isNew = isNewFile(fullPath);
          bubbles += `
        <div class="doc-bubble" style="animation-delay:${delay}ms" onclick="openFile('${escJs(name)}')">
          <div class="doc-icon" style="background:${meta.color}1f;color:${meta.color};">
            <i class="fa-solid ${meta.icon}"></i>
            <span class="read-badge ${read ? 'is-read' : ''}" onclick="event.stopPropagation(); toggleReadUI('${escJs(fullPath)}')" title="${read ? 'Mark as unread' : 'Mark as read'}"><i class="fa-solid fa-check"></i></span>
          </div>
          <div class="doc-info">
            <div class="doc-name">${esc(name)}${isNew ? ' <span class="new-pill">NEW</span>' : ''}</div>
            <div class="doc-meta">${val}</div>
          </div>
          <div class="doc-action"><i class="fa-solid fa-arrow-down"></i></div>
        </div>`;
        }
      });

      el.chatArea.innerHTML = `<div class="chat-body">${bubbles}</div>`;
      el.chatArea.scrollTop = 0;
      animateSwap(el.chatArea.firstElementChild, newDepth, lastChatDepth);
      lastChatDepth = newDepth;
    }

    function pushPath(name) { chatCtx.path.push(name); renderChat(); pushHistoryState(); }
    function popPath() { chatCtx.path.pop(); renderChat(); pushHistoryState(); }
    function jumpPath(idx) { chatCtx.path = chatCtx.path.slice(0, idx); renderChat(); pushHistoryState(); }

    function toggleReadUI(path) {
      toggleRead(path);
      renderChat();
      if (sidebarLevel === "subjects") renderSidebar();
    }

    function updateActiveRowHighlight() {
      // Lightweight — just toggles the highlight on existing sidebar rows
      // instead of rebuilding the whole list (which used to cause a visible
      // flash/reflow every time you switched subjects).
      if (sidebarLevel !== "subjects") return;
      const rows = el.sidebarList.querySelectorAll('.list-row[data-subject-key]');
      rows.forEach(r => {
        const isActive = !!chatCtx && r.dataset.year === chatCtx.year && r.dataset.sem === chatCtx.sem && r.dataset.subjectKey === chatCtx.subjectKey;
        r.classList.toggle('row-active', isActive);
      });
    }

    function openSubject(year, sem, key) {
      const subjectObj = fileTree[year][sem][key];
      chatCtx = { year, sem, subjectKey: key, subjectObj, path: [] };
      lastChatDepth = -999; // force fade rather than directional slide on fresh open
      renderChat();
      updateActiveRowHighlight();
      if (window.innerWidth < 768) {
        el.app.classList.add("chat-open");
      }
      pushHistoryState();
    }

    function closeChat() {
      el.app.classList.remove("chat-open");
      pushHistoryState();
    }

    const IMAGE_EXTS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg']);
    const TEXT_EXTS = new Set(['txt', 'md', 'csv', 'log']);

    function openFile(name) {
      const parts = [chatCtx.year, chatCtx.sem, chatCtx.subjectKey, ...chatCtx.path, name];
      const fullPath = parts.join("/");
      markRead(fullPath);
      clearNewFlag(fullPath);
      const safeUrl = parts.map(part => encodeURIComponent(part)).join("/");
      const ext = name.split('.').pop().toLowerCase();
      if (ext === 'pdf') {
        openFileViewer(safeUrl, name, 'pdf');
      } else if (IMAGE_EXTS.has(ext)) {
        openFileViewer(safeUrl, name, 'image');
      } else if (TEXT_EXTS.has(ext)) {
        openFileViewer(safeUrl, name, 'text');
      } else {
        window.open(safeUrl, "_blank");
      }
      renderChat();
      if (sidebarLevel === "subjects") renderSidebar();
    }

    /* ---------- In-app file viewer ----------
       Opens PDFs, images, and text files inline instead of forcing an
       immediate download, so students can read first and only save the
       file if they actually need it. Anything else (docx, pptx, zip,
       etc.) still opens/downloads in a new tab since the browser can't
       render those inline anyway.

       PDFs are rendered ourselves via PDF.js onto <canvas> pages rather
       than handed to an <iframe>. Android's WebView (which is what an
       installed/home-screen PWA actually runs in) has no built-in PDF
       plugin the way desktop Chrome or a normal browser tab does, so an
       iframe just shows a blank "Open" download card there instead of
       the document. */
    let pdfRenderToken = 0;
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    function openFileViewer(url, name, kind) {
      const body = document.getElementById('fileViewerBody');
      pdfRenderToken++;
      if (kind === 'pdf') {
        body.innerHTML = `<div class="pdf-canvas-wrap" id="pdfCanvasWrap"><div class="zoom-content" id="pdfZoomContent"><div class="file-viewer-loading">Loading PDF…</div></div><div class="zoom-hint" id="pdfZoomHint">Pinch to zoom</div></div>`;
        renderPdf(url);
        enablePinchZoom(document.getElementById('pdfCanvasWrap'), document.getElementById('pdfZoomHint'));
      } else if (kind === 'image') {
        body.innerHTML = `<div class="file-viewer-image-wrap" id="imgZoomWrap"><div class="zoom-content"><img src="${esc(url)}" alt="${esc(name)}"></div><div class="zoom-hint" id="imgZoomHint">Pinch to zoom</div></div>`;
        {
          const wrapEl = document.getElementById('imgZoomWrap');
          const imgEl = wrapEl.querySelector('img');
          imgEl.style.maxWidth = wrapEl.clientWidth + 'px';
          imgEl.style.maxHeight = wrapEl.clientHeight + 'px';
        }
        enablePinchZoom(document.getElementById('imgZoomWrap'), document.getElementById('imgZoomHint'));
        {
          const wrapEl = document.getElementById('imgZoomWrap');
          const imgEl = wrapEl.querySelector('img');
          if (imgEl.complete) wrapEl._resetZoom();
          else imgEl.addEventListener('load', () => wrapEl._resetZoom());
        }
      } else if (kind === 'text') {
        body.innerHTML = `<div class="file-viewer-loading">Loading…</div>`;
        fetch(url).then(r => r.text()).then(text => {
          if (document.getElementById('fileViewerOverlay').dataset.url !== url) return;
          body.innerHTML = `<pre class="file-viewer-text"></pre>`;
          body.querySelector('.file-viewer-text').textContent = text;
        }).catch(() => {
          if (document.getElementById('fileViewerOverlay').dataset.url !== url) return;
          body.innerHTML = `<div class="file-viewer-loading">Couldn't load preview — try "Open in new tab" instead.</div>`;
        });
      }
      document.getElementById('fileViewerOverlay').dataset.url = url;
      document.getElementById('fileViewerTitle').textContent = name;
      const dl = document.getElementById('fileViewerDownload');
      dl.href = url;
      dl.setAttribute('download', name);
      document.getElementById('fileViewerExternal').onclick = () => window.open(url, '_blank');
      document.getElementById('fileViewerOverlay').classList.add('is-open');
      document.body.style.overflow = 'hidden';
    }

    /* ---------- Pinch-to-zoom / pan ----------
       The app's viewport disables native pinch-zoom (maximum-scale=1) so
       the UI feels app-like everywhere else, but that also blocks
       zooming into a PDF page or image — so inside the viewer we drive
       zoom and pan ourselves via touch events and a CSS transform. */
    function enablePinchZoom(container, hintEl) {
      const content = container.querySelector('.zoom-content');
      if (!content) return;
      let scale = 1, originX = 0, originY = 0;
      const minScale = 1, maxScale = 5;
      let pinchStartDist = null, pinchStartScale = 1, pinchMidX = 0, pinchMidY = 0;
      let panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0, panning = false;
      let hintTimer = null;

      function showHint() {
        if (!hintEl) return;
        hintEl.classList.add('is-visible');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hintEl.classList.remove('is-visible'), 1400);
      }

      function clamp() {
        const cw = container.clientWidth, ch = container.clientHeight;
        const contentW = content.scrollWidth * scale;
        const contentH = content.scrollHeight * scale;
        const minX = Math.min(0, cw - contentW);
        const minY = Math.min(0, ch - contentH);
        originX = contentW <= cw ? (cw - contentW) / 2 : Math.max(minX, Math.min(0, originX));
        originY = contentH <= ch ? Math.max(0, Math.min(0, originY)) : Math.max(minY, Math.min(0, originY));
      }

      function apply() {
        content.style.transform = `translate(${originX}px, ${originY}px) scale(${scale})`;
      }

      function reset() {
        scale = 1; originX = 0; originY = 0;
        clamp();
        apply();
      }
      container._resetZoom = reset;

      function dist(a, b) {
        return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }

      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          pinchStartDist = dist(e.touches[0], e.touches[1]);
          pinchStartScale = scale;
          const rect = container.getBoundingClientRect();
          pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
          pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
          panning = false;
        } else if (e.touches.length === 1) {
          panStartX = e.touches[0].clientX;
          panStartY = e.touches[0].clientY;
          panOriginX = originX;
          panOriginY = originY;
          panning = true;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist) {
          e.preventDefault();
          const newDist = dist(e.touches[0], e.touches[1]);
          const newScale = Math.max(minScale, Math.min(maxScale, pinchStartScale * (newDist / pinchStartDist)));
          originX = pinchMidX - (pinchMidX - originX) * (newScale / scale);
          originY = pinchMidY - (pinchMidY - originY) * (newScale / scale);
          scale = newScale;
          clamp();
          apply();
        } else if (e.touches.length === 1 && panning && scale > 1) {
          e.preventDefault();
          originX = panOriginX + (e.touches[0].clientX - panStartX);
          originY = panOriginY + (e.touches[0].clientY - panStartY);
          clamp();
          apply();
        } else if (e.touches.length === 1 && panning && scale === 1 && content.scrollHeight > container.clientHeight) {
          // At 1x, a PDF can still be taller than the viewer — allow a
          // single-finger vertical drag to move between pages.
          e.preventDefault();
          originY = panOriginY + (e.touches[0].clientY - panStartY);
          clamp();
          apply();
        }
      }, { passive: false });

      container.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) pinchStartDist = null;
        if (e.touches.length === 0) panning = false;
      });

      let lastTapTime = 0;
      container.addEventListener('touchend', (e) => {
        if (e.touches.length > 0 || e.changedTouches.length !== 1) return;
        const now = Date.now();
        if (now - lastTapTime < 300) {
          const rect = container.getBoundingClientRect();
          const tapX = e.changedTouches[0].clientX - rect.left;
          const tapY = e.changedTouches[0].clientY - rect.top;
          const newScale = scale > 1 ? 1 : 2.5;
          originX = tapX - (tapX - originX) * (newScale / scale);
          originY = tapY - (tapY - originY) * (newScale / scale);
          scale = newScale;
          clamp();
          apply();
          lastTapTime = 0;
        } else {
          lastTapTime = now;
        }
      });

      new MutationObserver(() => { clamp(); apply(); }).observe(content, { childList: true, subtree: true });
      reset();
      showHint();
    }

    function renderPdf(url) {
      const myToken = pdfRenderToken;
      const wrap = document.getElementById('pdfZoomContent');
      if (!window.pdfjsLib) {
        wrap.innerHTML = `<div class="file-viewer-loading">PDF preview couldn't load — try "Open in new tab" instead.</div>`;
        return;
      }
      pdfjsLib.getDocument(url).promise.then(pdf => {
        if (myToken !== pdfRenderToken) return;
        wrap.innerHTML = '';
        const renderPage = (num) => {
          pdf.getPage(num).then(page => {
            if (myToken !== pdfRenderToken) return;
            const containerEl = document.getElementById('pdfCanvasWrap');
            const targetWidth = Math.min(900, (containerEl ? containerEl.clientWidth : 380) * 2);
            const baseViewport = page.getViewport({ scale: 1 });
            const scale = targetWidth / baseViewport.width;
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-page-canvas';
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            wrap.appendChild(canvas);
            page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise.then(() => {
              if (myToken === pdfRenderToken && num < pdf.numPages) renderPage(num + 1);
            });
          });
        };
        renderPage(1);
      }).catch(() => {
        if (myToken !== pdfRenderToken) return;
        wrap.innerHTML = `<div class="file-viewer-loading">Couldn't load this PDF — try "Open in new tab" instead.</div>`;
      });
    }

    function closeFileViewer() {
      pdfRenderToken++;
      document.getElementById('fileViewerOverlay').classList.remove('is-open');
      document.getElementById('fileViewerOverlay').dataset.url = '';
      document.getElementById('fileViewerBody').innerHTML = '';
      document.body.style.overflow = '';
    }

    /* =========================================================
       LIGHT DETERRENT — NOT real protection. Any browser's "view-source:"
       URL, DevTools opened from the menu, or just `git clone`-ing the
       public repo bypasses this instantly. It only stops the casual
       right-click on non-technical visitors. Kept intentionally simple
       so it never interferes with normal use of the site.
       ========================================================= */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.ctrlKey && (k === 'u' || k === 's')) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
      if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) e.preventDefault();
    });

    /* =========================================================
       INIT
       ========================================================= */
    initNewFilesTracking();
    renderSidebar();
    renderChat();
    try { history.replaceState(currentStateSnapshot(), ''); } catch (e) { /* ignore if History API unavailable */ }

    /* ---------- Global Search ---------- */
    const SEARCH_INDEX = [];
    function buildSearchIndex(node, path) {
      path = path || [];
      for (const [name, value] of Object.entries(node || {})) {
        if (name === 'type' || name === 'icon') continue;
        const next = [...path, name];
        if (value && typeof value === 'object') {
          if (value.type === 'subject') {
            SEARCH_INDEX.push({ kind: 'subject', name, path: next, year: path[0], sem: path[1], key: name, icon: value.icon || 'fa-solid fa-book' });
            buildSearchIndex(value.files || {}, next);
          } else {
            buildSearchIndex(value, next);
          }
        } else {
          SEARCH_INDEX.push({ kind: 'file', name, path: next, year: path[0], sem: path[1], ext: String(value || 'file').toLowerCase() });
        }
      }
    }
    buildSearchIndex(fileTree);

    function searchMatches(q) {
      q = q.trim().toLowerCase();
      if (!q) return [];
      const terms = q.split(/\s+/);
      return SEARCH_INDEX.map(item => {
        const haystack = item.path.join(' ').toLowerCase();
        let score = 0;
        const lname = item.name.toLowerCase();
        if (lname.startsWith(q)) score += 80;
        if (lname.includes(q)) score += 45;
        if (haystack.includes(q)) score += 20;
        terms.forEach(t => { if (haystack.includes(t)) score += 8; });
        return { item, score };
      }).filter(x => x.score > 0)
        .sort((a, b) => b.score - a.score || a.item.name.localeCompare(b.item.name))
        .slice(0, 40)
        .map(x => x.item);
    }

    function iconForSearch(item) {
      if (item.kind === 'subject') return item.icon;
      const m = { pdf: 'fa-file-pdf', doc: 'fa-file-word', docx: 'fa-file-word', ppt: 'fa-file-powerpoint', pptx: 'fa-file-powerpoint', img: 'fa-file-image', jpg: 'fa-file-image', jpeg: 'fa-file-image', png: 'fa-file-image', txt: 'fa-file-lines', exe: 'fa-gear' };
      return 'fa-solid ' + (m[item.ext] || 'fa-file');
    }

    // Navigates using the app's own state machine (same path popstate/back
    // button restoration uses), instead of guessing at function names or
    // clicking DOM elements by matching text.
    function openSearchTarget(item) {
      const year = item.year, sem = item.sem, subjectKey = item.path[2];
      const folderPath = item.kind === 'file' ? item.path.slice(3, -1) : [];
      const state = {
        sidebarLevel: "subjects",
        sidebarYear: year,
        sidebarSem: sem,
        chat: { year, sem, subjectKey, path: folderPath },
        mobileChatOpen: window.innerWidth < 768
      };
      applyStateSnapshot(state);
      pushHistoryState();
      const input = document.getElementById('globalSearchInput');
      if (input) input.value = '';
      renderSearchResults('');
    }

    function renderSearchResults(q) {
      const box = document.getElementById('globalSearchResults');
      if (!box) return;
      q = q.trim();
      if (!q) { box.innerHTML = ''; box.classList.remove('is-open'); return; }
      const results = searchMatches(q);
      box.classList.add('is-open');
      if (!results.length) {
        box.innerHTML = '<div class="search-empty"><i class="fa-solid fa-magnifying-glass"></i><br>No matching study material found.</div>';
        return;
      }
      box.innerHTML = results.map((item, i) => `
        <div class="search-result" role="option" tabindex="0" data-search-index="${i}">
          <div class="search-result-icon"><i class="${esc(iconForSearch(item))}"></i></div>
          <div class="search-result-body">
            <div class="search-result-name">${esc(prettyName(item.name))}</div>
            <div class="search-result-path">${esc(item.path.slice(0, -1).map(prettyName).join(' › ') || 'ECSHub')} · ${esc(item.kind === 'subject' ? 'SUBJECT' : item.ext.toUpperCase())}</div>
          </div>
          <i class="fa-solid fa-chevron-right" style="color:var(--chevron-color);font-size:12px"></i>
        </div>`).join('');
      box.querySelectorAll('.search-result').forEach(el => {
        const item = results[Number(el.dataset.searchIndex)];
        el.addEventListener('click', () => { openSearchTarget(item); box.classList.remove('is-open'); });
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSearchTarget(item); box.classList.remove('is-open'); }
        });
      });
    }

    function initGlobalSearch() {
      const input = document.getElementById('globalSearchInput'), box = document.getElementById('globalSearchResults');
      if (!input || !box) return;
      input.addEventListener('input', e => renderSearchResults(e.target.value));
      input.addEventListener('focus', () => { if (input.value.trim()) renderSearchResults(input.value); });
      document.addEventListener('click', e => {
        const root = document.getElementById('globalSearch');
        if (root && !root.contains(e.target)) box.classList.remove('is-open');
      });
      input.addEventListener('keydown', e => {
        if (e.key === 'Escape') { input.value = ''; box.classList.remove('is-open'); input.blur(); }
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initGlobalSearch);
    else initGlobalSearch();


    /* ---------- ECSHub Intro — WhatsApp-style splash (logo only) ---------- */
    (function () {
      const splash = document.getElementById('ecshubSplash');
      if (!splash) return;

      // Quick, like WhatsApp's own splash: logo fades in, holds briefly,
      // then the logo/credit fade out fast (so nothing ghosts over the
      // real content), and only then does the empty backdrop fade away.
      const MIN_SHOW_MS = 1600;
      const CONTENT_FADE_MS = 180;
      const FADE_MS = 500;
      const startedAt = performance.now();
      let hidden = false;

      function hideSplash() {
        if (hidden) return;
        hidden = true;

        const elapsed = performance.now() - startedAt;
        const wait = Math.max(0, MIN_SHOW_MS - elapsed);

        setTimeout(() => {
          splash.classList.add('content-hide');

          setTimeout(() => {
            splash.classList.add('is-hiding');

            setTimeout(() => {
              splash.remove();
            }, FADE_MS + 80);
          }, CONTENT_FADE_MS);
        }, wait);
      }

      if (document.readyState === 'complete') {
        hideSplash();
      } else {
        window.addEventListener('load', hideSplash, { once: true });
      }

      // Safety net: even on a slow/offline load, never trap the user.
      setTimeout(hideSplash, 4000);
    })();

    /* ---------- PWA ---------- */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    /* ---------- Install App banner ----------
       Shows a dismissible WhatsApp-style promo strip when the browser
       signals the site is installable, so students who don't already
       know about "Add to Home Screen" get offered it directly. */
    (function () {
      const banner = document.getElementById('installBanner');
      const btn = document.getElementById('installBannerBtn');
      const closeBtn = document.getElementById('installBannerClose');
      if (!banner || !btn || !closeBtn) return;

      const DISMISS_KEY = 'ecshub_install_dismissed';
      let deferredPrompt = null;

      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        if (isStandalone() || safeGet(DISMISS_KEY, false)) return;
        deferredPrompt = e;
        banner.classList.add('is-visible');
      });

      btn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        banner.classList.remove('is-visible');
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (e) { /* ignore */ }
        deferredPrompt = null;
      });

      closeBtn.addEventListener('click', () => {
        banner.classList.remove('is-visible');
        safeSet(DISMISS_KEY, true);
      });

      window.addEventListener('appinstalled', () => {
        banner.classList.remove('is-visible');
        safeSet(DISMISS_KEY, true);
      });
    })();
</script>
