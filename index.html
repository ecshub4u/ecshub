    body.dark {
      --wa-green-tint: #0b3b32;
      --bg-header: #202c33;
      --bg-sidebar: #111b21;
      --bg-chat: #0b141a;
      --bg-card: #202c33;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --text-muted: #5c6a72;
      --border-color: #222d34;

      --hover-bg: #202c33;
      --active-bg: #2a3942;
      --folder-color: #8696a0;
      --chevron-color: #576267;
      --breadcrumb-bg: #182229;

      --doodle-url: url("data:image/svg+xml,%3Csvg xmlns=%27http:%2F%2Fwww.w3.org%2F2000%2Fsvg%27 width=%27220%27 height=%27220%27 viewBox=%270 0 220 220%27%3E%3Cg fill=%27none%27 stroke=%27%23ffffff%27 stroke-width=%271.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27 opacity=%270.045%27%3E%3Cpath d=%27M20 34 L46 24 L72 34 L46 44 Z%27%2F%3E%3Cpath d=%27M32 39 L32 52 C32 57 60 57 60 52 L60 39%27%2F%3E%3Cline x1=%2772%27 y1=%2734%27 x2=%2772%27 y2=%2750%27%2F%3E%3Ccircle cx=%2772%27 cy=%2752%27 r=%272.2%27 fill=%27%23ffffff%27 stroke=%27none%27%2F%3E%3Cpath d=%27M118 66 C112 62 100 61 94 63 L94 92 C100 90 112 91 118 95 C124 91 136 90 142 92 L142 63 C136 61 124 62 118 66 Z%27%2F%3E%3Cline x1=%27118%27 y1=%2766%27 x2=%27118%27 y2=%2795%27%2F%3E%3Cpath d=%27M30 150 L58 122 L66 130 L38 158 Z%27%2F%3E%3Cpath d=%27M58 122 L64 116 L72 124 L66 130 Z%27%2F%3E%3Cline x1=%2734%27 y1=%27154%27 x2=%2738%27 y2=%27158%27%2F%3E%3Cpath d=%27M150 168 L172 160 L194 168 L172 176 Z%27%2F%3E%3Cpath d=%27M160 172 L160 182 C160 186 184 186 184 182 L184 172%27%2F%3E%3C%2Fg%3E%3Cg fill=%27%23ffffff%27 opacity=%270.04%27 font-family=%27Georgia, Times New Roman, serif%27%3E%3Ctext x=%27150%27 y=%2745%27 font-size=%2734%27%3E%CF%80%3C%2Ftext%3E%3Ctext x=%2715%27 y=%27115%27 font-size=%2730%27%3E%E2%88%91%3C%2Ftext%3E%3Ctext x=%2790%27 y=%27150%27 font-size=%2728%27%3E%E2%88%9A%3C%2Ftext%3E%3Ctext x=%27175%27 y=%27115%27 font-size=%2726%27%3E%C2%B1%3C%2Ftext%3E%3C%2Fg%3E%3C%2Fsvg%3E");

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, 'Lucida Grande', Arial, Ubuntu, Cantarell, 'Fira Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      background: var(--bg-sidebar);
      transition: background .25s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: var(--bg-sidebar);
    }

    .scroll {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .scroll::-webkit-scrollbar {
      width: 8px;
    }

    .scroll::-webkit-scrollbar-thumb {
      background: rgba(127, 127, 127, .3);
      border-radius: 8px;
    }

    .scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ---------- Motion ---------- */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(26px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-26px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .anim-right {
      animation: slideInRight .3s var(--ease);
      will-change: transform, opacity;
    }

    .anim-left {
      animation: slideInLeft .3s var(--ease);
      will-change: transform, opacity;
    }

    .anim-fade {
      animation: fadeIn .32s var(--ease);
      will-change: opacity;
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 420px;
      min-width: 320px;
      max-width: 460px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .sidebar-header {
      min-height: 64px;
      padding: 10px 16px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--wa-green);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 19px;
      flex-shrink: 0;
    }

    .brand-text {
      flex: 1;
      min-width: 0;
    }

    .brand-text .brand-title {
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .brand-text .brand-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      flex-shrink: 0;
      background: transparent;
      border: none;
      font-size: 17px;
      transition: background .15s var(--ease), transform .12s var(--ease), color .2s;
      touch-action: manipulation;
    }

    .icon-btn:hover {
      background: rgba(127, 127, 127, .14);
    }

    .icon-btn:active {
      transform: scale(.9);
    }

    .sidebar-header-text {
      flex: 1;
      min-width: 0;
    }

    .sidebar-header-text .sh-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-header-text .sh-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-sidebar);
      transition: background .25s var(--ease);
    }

    .sidebar-footer {
      padding: 8px 14px;
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--divider-color);
      background: var(--bg-header);
      transition: background .25s var(--ease), color .25s var(--ease);
    }

    /* Continue Your Journey strip */
    .recent-strip {
      padding: 14px 16px 6px;
      border-bottom: 1px solid var(--divider-color);
    }

    .recent-strip .rs-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .recent-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .recent-row::-webkit-scrollbar {
      height: 0;
    }

    .recent-card {
      flex: 0 0 auto;
      width: 132px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 10px;
      cursor: pointer;
      transition: transform .15s var(--ease), box-shadow .15s var(--ease);
      animation: popIn .3s var(--ease) both;
      touch-action: manipulation;
    }

    .recent-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .recent-card:active {
      transform: scale(.97);
    }

    .recent-card .rc-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--wa-green-tint);
      color: var(--wa-green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .recent-card .rc-icon.rc-icon-brand {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .recent-card .rc-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 32px;
    }

    .recent-card .rc-progress {
      margin-top: 8px;
      height: 4px;
      border-radius: 2px;
      background: var(--track-color);
      overflow: hidden;
    }

    .recent-card .rc-progress-fill {
      height: 100%;
      background: var(--wa-green);
      border-radius: 2px;
      transition: width .3s var(--ease);
    }

    .recent-card .rc-pct {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .list-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background .12s var(--ease), transform .1s var(--ease);
      border-bottom: 1px solid var(--divider-color);
      touch-action: manipulation;
    }

    .list-row:hover {
      background: var(--hover-bg);
    }

    .list-row:active {
      transform: scale(.99);
    }

    .list-row.row-active {
      background: var(--active-bg);
      border-left: 3px solid var(--wa-green);
      padding-left: 13px;
    }

    .row-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--wa-green-tint);
      color: var(--wa-green-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
    }

    .row-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .row-avatar.avatar-brand {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }

    .row-body {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      font-size: 15.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-sub {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .row-sub .done-tag {
      color: var(--wa-green-dark);
      font-weight: 600;
    }

    .row-chevron {
      color: var(--chevron-color);
      font-size: 14px;
      flex-shrink: 0;
    }

    .empty-list-msg {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .empty-list-msg i {
      font-size: 34px;
      color: var(--chevron-color);
      display: block;
      margin-bottom: 12px;
    }

    /* ---------- Chat / right panel ---------- */
    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-chat);
      min-width: 0;
      position: relative;
      transition: background .25s var(--ease);
    }

    .chat-header {
      min-height: 64px;
      padding: 8px 16px;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 2;
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .chat-back-btn {
      display: none;
    }

    .chat-header-title {
      font-size: 16.5px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-progress-track {
      height: 3px;
      background: var(--track-color);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
      width: 100%;
      max-width: 220px;
    }

    .chat-progress-fill {
      height: 100%;
      background: var(--wa-green);
      border-radius: 2px;
      transition: width .35s var(--ease);
    }

    .breadcrumb-bar {
      padding: 9px 16px;
      background: var(--breadcrumb-bg);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      z-index: 2;
      transition: background .25s var(--ease), border-color .25s var(--ease);
    }

    .crumb {
      color: var(--wa-green-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: color .15s;
      touch-action: manipulation;
    }

    .crumb:hover {
      text-decoration: underline;
    }

    .crumb.current {
      color: var(--text-primary);
      font-weight: 600;
      cursor: default;
    }

    .crumb.current:hover {
      text-decoration: none;
    }

    .crumb-sep {
      color: var(--chevron-color);
    }

    .up-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--wa-green-dark);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-right: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      touch-action: manipulation;
      transition: background .15s var(--ease), transform .1s var(--ease);
    }

    .up-btn:hover {
      background: rgba(0, 168, 132, .12);
    }

    .up-btn:active {
      transform: scale(.95);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 6% 30px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background-color: var(--bg-chat);
      background-image: var(--doodle-url);
      background-repeat: repeat;
      transition: background-color .25s var(--ease);
    }

    .doc-bubble {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 480px;
      width: fit-content;
      min-width: 260px;
      cursor: pointer;
      animation: slideUp .38s var(--ease) both;
      transition: box-shadow .18s var(--ease), transform .12s var(--ease), background .25s var(--ease);
      touch-action: manipulation;
    }

    .doc-bubble:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .doc-bubble:active {
      transform: translateY(0) scale(.99);
    }

    .doc-icon {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      position: relative;
    }

    .doc-info {
      flex: 1;
      min-width: 0;
    }

    .doc-name {
      font-size: 14.5px;
      color: var(--text-primary);
      font-weight: 500;
      line-height: 1.32;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .doc-meta {
      font-size: 11.5px;
      color: var(--text-secondary);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .doc-action {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 15px;
      transition: .18s var(--ease);
    }

    .doc-bubble:hover .doc-action {
      color: #fff;
      background: var(--wa-green);
    }

    .folder-bubble .doc-icon {
      background: rgba(134, 150, 160, .16);
      color: var(--folder-color);
    }

    .read-badge {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--chevron-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: transparent;
      cursor: pointer;
      transition: all .18s var(--ease);
    }

    .read-badge:hover {
      border-color: var(--wa-green);
      transform: scale(1.15);
    }

    .read-badge.is-read {
      background: var(--wa-green);
      border-color: var(--wa-green);
      color: #fff;
    }

    .section-empty {
      margin: auto;
      text-align: center;
      color: var(--text-secondary);
      background: var(--bg-card);
      opacity: .9;
      border-radius: var(--radius-lg);
      padding: 34px 30px;
      font-size: 14px;
      animation: fadeIn .3s var(--ease);
    }

    .section-empty i {
      font-size: 30px;
      color: var(--chevron-color);
      display: block;
      margin-bottom: 10px;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 40px;
      background: #f0eee9;
      animation: fadeIn .4s var(--ease);
      transition: background .25s var(--ease);
    }

    body.dark .chat-empty {
      background: var(--bg-header);
    }

    .chat-empty .ce-icon {
      width: 110px;
      height: 110px;
      min-width: 110px;
      min-height: 110px;
      max-width: 110px;
      max-height: 110px;
      flex-shrink: 0;
      flex-grow: 0;
      box-sizing: border-box;
      border-radius: 50%;
      background: #e7f8f3;
      color: var(--wa-green);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .chat-empty .ce-icon i {
      font-size: 46px;
      line-height: 1;
    }

    .chat-empty .ce-title {
      font-size: 27px;
      font-weight: 300;
      color: var(--text-primary);
      margin: 0;
    }

    .chat-empty .ce-sub {
      max-width: 420px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .chat-empty .ce-note {
      margin-top: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--wa-green-dark);
      background: #e7f8f3;
      padding: 8px 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* ---------- Mobile ---------- */
    @media (max-width:767px) {
      .sidebar {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      .chat {
        display: none;
        width: 100%;
      }

      .chat-empty .ce-icon {
        width: 90px;
        height: 90px;
        min-width: 90px;
        min-height: 90px;
        max-width: 90px;
        max-height: 90px;
      }

      .chat-empty .ce-icon i {
        font-size: 38px;
      }

      .chat-empty .ce-title {
        font-size: 22px;
      }

      .chat-empty .ce-sub {
        font-size: 13px;
      }

      .chat-empty .ce-note {
        font-size: 11.5px;
      }

      #app.chat-open .sidebar {
        display: none;
      }

      #app.chat-open .chat {
        display: flex;
      }

      .chat-back-btn {
        display: flex;
      }

      .chat-body {
        padding: 14px 4% 24px;
      }

      .doc-bubble {
        max-width: 100%;
        min-width: 0;
      }

      .brand-text .brand-title {
        font-size: 17px;
      }

      .recent-card {
        width: 118px;
      }
    }

    @media (min-width:768px) and (max-width:1024px) {
      .sidebar {
        width: 340px;
      }
    }

    /* =========================================================
       CONFIG / LOOKUPS
       ========================================================= */
    const YEAR_LABELS = { "first year": "First Year", "second year": "Second Year", "third year": "Third Year" };
    const YEAR_ORDINAL = { "first year": "1st", "second year": "2nd", "third year": "3rd" };
    const FILE_ICONS = {
      pdf: { icon: "fa-file-pdf", color: "#e02f2f" },
      doc: { icon: "fa-file-word", color: "#1f7aec" },
      ppt: { icon: "fa-file-powerpoint", color: "#e8792b" },
      img: { icon: "fa-file-image", color: "#9c4fd6" },
      txt: { icon: "fa-file-lines", color: "#6b7680" },
      exe: { icon: "fa-gear", color: "#e8792b" },
      file: { icon: "fa-file", color: "#6b7680" }
    };

    /* =========================================================
       PERSISTENCE (per-device, this browser only)
       ========================================================= */
    function safeGet(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* storage unavailable, ignore */ }
    }
    function getRecent() { return safeGet('ecshub_recent', []); }
    function pushRecent(year, sem, key) {
      let list = getRecent().filter(r => !(r.year === year && r.sem === sem && r.key === key));
      list.unshift({ year, sem, key });
      safeSet('ecshub_recent', list.slice(0, 6));
    }
    function getProgress() { return safeGet('ecshub_progress', {}); }
    function isRead(path) { return !!getProgress()[path]; }
    function markRead(path) {
      const m = getProgress();
      if (!m[path]) { m[path] = true; safeSet('ecshub_progress', m); }
    }
    function toggleRead(path) {
      const m = getProgress();
      if (m[path]) delete m[path]; else m[path] = true;
      safeSet('ecshub_progress', m);
    }
    function collectFilePaths(node, prefix) {
      let out = [];
      for (const [k, v] of Object.entries(node)) {
        if (k === "type") continue;
        if (typeof v === "object") out = out.concat(collectFilePaths(v, [...prefix, k]));
        else out.push([...prefix, k].join("/"));
      }
      return out;
    }
    function subjectProgress(year, sem, key, subjectObj) {
      const paths = collectFilePaths(subjectObj.files || {}, [year, sem, key]);
      const progress = getProgress();
      const done = paths.filter(p => progress[p]).length;
      return { done, total: paths.length };
    }

    /* ---------- Theme ---------- */
    function applyTheme(dark) {
      document.body.classList.toggle('dark', dark);
      safeSet('ecshub_theme', dark ? 'dark' : 'light');
    }
    function toggleTheme() {
      applyTheme(!document.body.classList.contains('dark'));
      renderSidebar();
      renderChat();
    }

    /* =========================================================
       BROWSER BACK/FORWARD SUPPORT
       Every in-app navigation (year/sem/subject/folder, opening or
       closing the mobile chat view) pushes a history entry, so the
       device/browser back button steps back through the app instead
       of leaving the site entirely.
       ========================================================= */
    let suppressHistoryPush = false;

    function currentStateSnapshot() {
      return {
        sidebarLevel, sidebarYear, sidebarSem,
        chat: chatCtx ? { year: chatCtx.year, sem: chatCtx.sem, subjectKey: chatCtx.subjectKey, path: chatCtx.path.slice() } : null,
        mobileChatOpen: el.app.classList.contains('chat-open')
      };
    }

    function pushHistoryState() {
      if (suppressHistoryPush) return;
      try { history.pushState(currentStateSnapshot(), ''); } catch (e) { /* ignore if History API unavailable */ }
    }

    function applyStateSnapshot(state) {
      if (!state) {
        sidebarLevel = "years"; sidebarYear = null; sidebarSem = null;
        chatCtx = null;
        el.app.classList.remove("chat-open");
        renderSidebar();
        renderChat();
        return;
      }
      sidebarLevel = state.sidebarLevel;
      sidebarYear = state.sidebarYear;
      sidebarSem = state.sidebarSem;
      if (state.chat) {
        const { year, sem, subjectKey, path } = state.chat;
        const subjectObj = fileTree[year] && fileTree[year][sem] && fileTree[year][sem][subjectKey];
        chatCtx = subjectObj ? { year, sem, subjectKey, subjectObj, path: path.slice() } : null;
      } else {
        chatCtx = null;
      }
      renderSidebar();
      renderChat();
      if (state.mobileChatOpen) el.app.classList.add("chat-open");
      else el.app.classList.remove("chat-open");
    }

    window.addEventListener('popstate', (e) => {
      suppressHistoryPush = true;
      applyStateSnapshot(e.state);
      suppressHistoryPush = false;
    });
    function themeBtnHtml() {
      const dark = document.body.classList.contains('dark');
      return `<button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode"><i class="fa-solid ${dark ? 'fa-sun' : 'fa-moon'}"></i></button>`;
    }
    (function initTheme() {
      // Always defaults to light mode, regardless of the visitor's system
      // preference. Dark mode only turns on if they explicitly chose it
      // before (via the toggle), remembered per-browser.
      const saved = safeGet('ecshub_theme', null);
      if (saved === 'dark') document.body.classList.add('dark');
    })();

    /* =========================================================
       STATE
       ========================================================= */
    let sidebarLevel = "years";   // years | sems | subjects
    let sidebarYear = null;
    let sidebarSem = null;
    let chatCtx = null;           // { year, sem, subjectKey, subjectObj, path:[] }
    const LEVEL_DEPTH = { years: 0, sems: 1, subjects: 2 };
    let lastSidebarDepth = 0;
    let lastChatDepth = -1; // -1 = empty state

    const el = {
      app: document.getElementById("app"),
      sidebarHeader: document.getElementById("sidebarHeader"),
      sidebarList: document.getElementById("sidebarList"),
      chatHeaderWrap: document.getElementById("chatHeaderWrap"),
      chatArea: document.getElementById("chatArea")
    };

    /* =========================================================
       HELPERS
       ========================================================= */
    function semRoman(k) { return k.replace(/sem/i, "").trim().toUpperCase(); }
    function semLabel(k) { return "Semester " + semRoman(k); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    function escJs(s) { return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'"); }
    function countFiles(obj) {
      let c = 0;
      for (const [k, v] of Object.entries(obj)) {
        if (k === "type" || k === "icon") continue;
        if (typeof v === "object") c += countFiles(v);
        else c++;
      }
      return c;
    }
    function isDevicon(iconClass) { return false; }
    function iconTag(iconClass) {
      // All subject icons render in the site's standard green — no per-brand coloring.
      return `<i class="${iconClass}"></i>`;
    }
    function subjectAvatar(name, icon) {
      if (icon === "yoga-img") {
        return `<div class="row-avatar">
      <img src="yoga.jpg" alt="${esc(name)}"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <i class="fa-solid fa-person-walking" style="display:none;font-size:19px;"></i>
    </div>`;
      }
      const brandCls = isDevicon(icon) ? ' avatar-brand' : '';
      return `<div class="row-avatar${brandCls}">${iconTag(icon)}</div>`;
    }
    function animateSwap(container, newDepth, lastDepth) {
      container.classList.remove('anim-right', 'anim-left', 'anim-fade');
      container.scrollTop = 0; // always start a fresh list/folder view from the top
      void container.offsetWidth; // reflow to restart animation
      if (lastDepth === -999 || newDepth === lastDepth) container.classList.add('anim-fade');
      else if (newDepth > lastDepth) container.classList.add('anim-right');
      else container.classList.add('anim-left');
    }

    /* =========================================================
       SIDEBAR RENDER
       ========================================================= */
    function renderRecentStrip() {
      const recent = getRecent().filter(r => fileTree[r.year] && fileTree[r.year][r.sem] && fileTree[r.year][r.sem][r.key]);
      if (recent.length === 0) return "";
      let cards = "";
      recent.forEach((r, i) => {
        const subj = fileTree[r.year][r.sem][r.key];
        const { done, total } = subjectProgress(r.year, r.sem, r.key, subj);
        const pct = total ? Math.round((done / total) * 100) : 0;
        const iconHtml = subj.icon === "yoga-img"
          ? `<i class="fa-solid fa-person-walking"></i>`
          : iconTag(subj.icon);
        cards += `
      <div class="recent-card" style="animation-delay:${i * 40}ms" onclick="openFromRecent('${escJs(r.year)}','${escJs(r.sem)}','${escJs(r.key)}')">
        <div class="rc-icon${isDevicon(subj.icon) ? ' rc-icon-brand' : ''}">${iconHtml}</div>
        <div class="rc-name">${esc(r.key)}</div>
        <div class="rc-progress"><div class="rc-progress-fill" style="width:${pct}%"></div></div>
        <div class="rc-pct">${total ? done + "/" + total + " reviewed" : "No files"}</div>
      </div>`;
      });
      return `
    <div class="recent-strip">
      <div class="rs-label"><i class="fa-solid fa-clock-rotate-left"></i> Continue your journey</div>
      <div class="recent-row">${cards}</div>
    </div>`;
    }

    function openFromRecent(year, sem, key) {
      sidebarYear = year; sidebarSem = sem; sidebarLevel = "subjects";
      openSubject(year, sem, key);
    }

    function renderSidebar() {
      const newDepth = LEVEL_DEPTH[sidebarLevel];

      if (sidebarLevel === "years") {
        el.sidebarHeader.innerHTML = `
      <div class="brand-logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="brand-text">
        <h1 class="brand-title">ECSHub</h1>
        <div class="brand-sub">Study materials for B.Sc. ECS</div>
      </div>
      ${themeBtnHtml()}`;
        let rows = renderRecentStrip();
        Object.keys(fileTree).forEach(year => {
          const semCount = Object.keys(fileTree[year]).length;
          rows += `
        <div class="list-row" onclick="goSemesters('${escJs(year)}')">
          <div class="row-avatar">${YEAR_ORDINAL[year] || ""}</div>
          <div class="row-body">
            <div class="row-title">${esc(YEAR_LABELS[year] || year)}</div>
            <div class="row-sub">${semCount} semester${semCount !== 1 ? "s" : ""}</div>
          </div>
          <i class="fa-solid fa-chevron-right row-chevron"></i>
        </div>`;
        });
        el.sidebarList.innerHTML = rows;
      }

      else if (sidebarLevel === "sems") {
        el.sidebarHeader.innerHTML = `
      <button class="icon-btn" onclick="goYears()"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="sidebar-header-text">
        <div class="sh-title">${esc(YEAR_LABELS[sidebarYear] || sidebarYear)}</div>
        <div class="sh-sub">Select a semester</div>
      </div>
      ${themeBtnHtml()}`;
        let rows = "";
        Object.keys(fileTree[sidebarYear]).forEach(sem => {
          const subCount = Object.keys(fileTree[sidebarYear][sem]).length;
          rows += `
        <div class="list-row" onclick="goSubjects('${escJs(sem)}')">
          <div class="row-avatar">${esc(semRoman(sem))}</div>
          <div class="row-body">
            <div class="row-title">${esc(semLabel(sem))}</div>
            <div class="row-sub">${subCount ? subCount + " subject" + (subCount !== 1 ? "s" : "") : "No subjects added yet"}</div>
          </div>
          <i class="fa-solid fa-chevron-right row-chevron"></i>
        </div>`;
        });
        el.sidebarList.innerHTML = rows;
      }

      else if (sidebarLevel === "subjects") {
        el.sidebarHeader.innerHTML = `
      <button class="icon-btn" onclick="goSemesters('${escJs(sidebarYear)}')"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="sidebar-header-text">
        <div class="sh-title">${esc(semLabel(sidebarSem))}</div>
        <div class="sh-sub">${esc(YEAR_LABELS[sidebarYear] || sidebarYear)}</div>
      </div>
      ${themeBtnHtml()}`;
        const subjects = fileTree[sidebarYear][sidebarSem];
        const keys = Object.keys(subjects);
        if (keys.length === 0) {
          el.sidebarList.innerHTML = `
        <div class="empty-list-msg">
          <i class="fa-regular fa-folder-open"></i>
          No subjects added yet for this semester.
        </div>`;
        } else {
          let rows = "";
          keys.forEach(key => {
            const subj = subjects[key];
            const fCount = countFiles(subj.files || {});
            const { done } = subjectProgress(sidebarYear, sidebarSem, key, subj);
            const active = chatCtx && chatCtx.year === sidebarYear && chatCtx.sem === sidebarSem && chatCtx.subjectKey === key;
            rows += `
          <div class="list-row ${active ? 'row-active' : ''}" data-year="${esc(sidebarYear)}" data-sem="${esc(sidebarSem)}" data-subject-key="${esc(key)}" onclick="openSubject('${escJs(sidebarYear)}','${escJs(sidebarSem)}','${escJs(key)}')">
            ${subjectAvatar(key, subj.icon)}
            <div class="row-body">
              <div class="row-title">${esc(key)}</div>
              <div class="row-sub">${fCount} file${fCount !== 1 ? "s" : ""}${done > 0 ? ' · <span class="done-tag">' + done + '/' + fCount + ' done</span>' : ''}</div>
            </div>
            <i class="fa-solid fa-chevron-right row-chevron"></i>
          </div>`;
          });
          el.sidebarList.innerHTML = rows;
        }
      }

      animateSwap(el.sidebarList, newDepth, lastSidebarDepth);
      lastSidebarDepth = newDepth;
    }

    function goYears() { sidebarLevel = "years"; sidebarYear = null; sidebarSem = null; renderSidebar(); pushHistoryState(); }
    function goSemesters(year) { sidebarLevel = "sems"; sidebarYear = year; sidebarSem = null; renderSidebar(); pushHistoryState(); }
    function goSubjects(sem) { sidebarLevel = "subjects"; sidebarSem = sem; renderSidebar(); pushHistoryState(); }

    /* =========================================================
       CHAT (RIGHT PANEL) RENDER
       ========================================================= */
    function renderChat() {
      if (!chatCtx) {
        el.chatHeaderWrap.innerHTML = "";
        el.chatArea.innerHTML = `
      <div class="chat-empty">
        <div class="ce-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="ce-title">ECSHub</div>
        <div class="ce-sub">Select a subject from the left to view its syllabus, notes, previous year papers, practicals and question banks.</div>
        <div class="ce-note"><i class="fa-solid fa-lock"></i> End-to-end structured learning — no logins, no ads.</div>
      </div>`;
        lastChatDepth = -1;
        return;
      }

      const { year, sem, subjectKey, subjectObj, path } = chatCtx;
      const { done, total } = subjectProgress(year, sem, subjectKey, subjectObj);
      const pct = total ? Math.round((done / total) * 100) : 0;

      const avatarHtml = subjectObj.icon === "yoga-img"
        ? `<div class="row-avatar" style="width:40px;height:40px;">
         <img src="yoga.jpg" alt="${esc(subjectKey)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
         <i class="fa-solid fa-person-walking" style="display:none;font-size:16px;"></i>
       </div>`
        : `<div class="row-avatar${isDevicon(subjectObj.icon) ? ' avatar-brand' : ''}" style="width:40px;height:40px;font-size:16px;">${iconTag(subjectObj.icon)}</div>`;

      el.chatHeaderWrap.innerHTML = `
    <div class="chat-header">
      <button class="icon-btn chat-back-btn" onclick="closeChat()"><i class="fa-solid fa-arrow-left"></i></button>
      ${avatarHtml}
      <div style="flex:1;min-width:0;">
        <div class="chat-header-title">${esc(subjectKey)}</div>
        <div class="chat-header-sub">${esc(YEAR_LABELS[year] || year)} • ${esc(semLabel(sem))}${total ? ' • ' + done + '/' + total + ' reviewed' : ''}</div>
        ${total ? `<div class="chat-progress-track"><div class="chat-progress-fill" style="width:${pct}%"></div></div>` : ''}
      </div>
      ${themeBtnHtml()}
    </div>
    <div class="breadcrumb-bar" id="breadcrumbBar"></div>`;

      let crumbHtml = "";
      if (path.length > 0) {
        crumbHtml += `<span class="up-btn" onclick="popPath()"><i class="fa-solid fa-arrow-turn-up" style="transform:rotate(-90deg);"></i> Back</span>`;
      }
      crumbHtml += `<span class="crumb ${path.length === 0 ? 'current' : ''}" onclick="jumpPath(0)">${esc(subjectKey)}</span>`;
      path.forEach((p, i) => {
        const isLast = i === path.length - 1;
        crumbHtml += `<span class="crumb-sep">›</span><span class="crumb ${isLast ? 'current' : ''}" onclick="jumpPath(${i + 1})">${esc(p)}</span>`;
      });
      document.getElementById("breadcrumbBar").innerHTML = crumbHtml;

      let node = subjectObj.files || {};
      for (const p of path) node = node[p];

      const entries = Object.entries(node).filter(([k]) => k !== "type");
      const folders = entries.filter(([, v]) => typeof v === "object");
      const files = entries.filter(([, v]) => typeof v === "string");
      const combined = [...folders, ...files];

      const newDepth = path.length + 1; // +1 so a fresh subject (depth0) differs from empty(-1)

      if (combined.length === 0) {
        el.chatArea.innerHTML = `<div class="chat-body"><div class="section-empty"><i class="fa-regular fa-folder-open"></i>No files here yet.</div></div>`;
        el.chatArea.scrollTop = 0;
        animateSwap(el.chatArea.firstElementChild, newDepth, lastChatDepth);
        lastChatDepth = newDepth;
        return;
      }

      let bubbles = "";
      combined.forEach(([name, val], idx) => {
        const delay = Math.min(idx * 40, 360);
        if (typeof val === "object") {
          const itemCount = countFiles(val);
          bubbles += `
        <div class="doc-bubble folder-bubble" style="animation-delay:${delay}ms" onclick="pushPath('${escJs(name)}')">
          <div class="doc-icon"><i class="fa-solid fa-folder"></i></div>
          <div class="doc-info">
            <div class="doc-name">${esc(name)}</div>
            <div class="doc-meta">${itemCount} item${itemCount !== 1 ? "s" : ""}</div>
          </div>
          <div class="doc-action"><i class="fa-solid fa-chevron-right"></i></div>
        </div>`;
        } else {
          const meta = FILE_ICONS[val] || FILE_ICONS.file;
          const fullPath = [year, sem, subjectKey, ...path, name].join("/");
          const read = isRead(fullPath);
          bubbles += `
        <div class="doc-bubble" style="animation-delay:${delay}ms" onclick="openFile('${escJs(name)}')">
          <div class="doc-icon" style="background:${meta.color}1f;color:${meta.color};">
            <i class="fa-solid ${meta.icon}"></i>
            <span class="read-badge ${read ? 'is-read' : ''}" onclick="event.stopPropagation(); toggleReadUI('${escJs(fullPath)}')" title="${read ? 'Mark as unread' : 'Mark as read'}"><i class="fa-solid fa-check"></i></span>
          </div>
          <div class="doc-info">
            <div class="doc-name">${esc(name)}</div>
            <div class="doc-meta">${val}</div>
          </div>
          <div class="doc-action"><i class="fa-solid fa-arrow-down"></i></div>
        </div>`;
        }
      });

      el.chatArea.innerHTML = `<div class="chat-body">${bubbles}</div>`;
      el.chatArea.scrollTop = 0;
      animateSwap(el.chatArea.firstElementChild, newDepth, lastChatDepth);
      lastChatDepth = newDepth;
    }

    function pushPath(name) { chatCtx.path.push(name); renderChat(); pushHistoryState(); }
    function popPath() { chatCtx.path.pop(); renderChat(); pushHistoryState(); }
    function jumpPath(idx) { chatCtx.path = chatCtx.path.slice(0, idx); renderChat(); pushHistoryState(); }

    function toggleReadUI(path) {
      toggleRead(path);
      renderChat();
      if (sidebarLevel === "subjects") renderSidebar();
    }

    function updateActiveRowHighlight() {
      // Lightweight — just toggles the highlight on existing sidebar rows
      // instead of rebuilding the whole list (which used to cause a visible
      // flash/reflow every time you switched subjects).
      if (sidebarLevel !== "subjects") return;
      const rows = el.sidebarList.querySelectorAll('.list-row[data-subject-key]');
      rows.forEach(r => {
        const isActive = !!chatCtx && r.dataset.year === chatCtx.year && r.dataset.sem === chatCtx.sem && r.dataset.subjectKey === chatCtx.subjectKey;
        r.classList.toggle('row-active', isActive);
      });
    }

    function openSubject(year, sem, key) {
      const subjectObj = fileTree[year][sem][key];
      chatCtx = { year, sem, subjectKey: key, subjectObj, path: [] };
      pushRecent(year, sem, key);
      lastChatDepth = -999; // force fade rather than directional slide on fresh open
      renderChat();
      updateActiveRowHighlight();
      if (window.innerWidth < 768) {
        el.app.classList.add("chat-open");
      }
      pushHistoryState();
    }

    function closeChat() {
      el.app.classList.remove("chat-open");
      pushHistoryState();
    }

    function openFile(name) {
      const parts = [chatCtx.year, chatCtx.sem, chatCtx.subjectKey, ...chatCtx.path, name];
      const fullPath = parts.join("/");
      markRead(fullPath);
      const safeUrl = parts.map(part => encodeURIComponent(part)).join("/");
      window.open(safeUrl, "_blank");
      renderChat();
      if (sidebarLevel === "subjects") renderSidebar();
    }

    /* =========================================================
       LIGHT DETERRENT — NOT real protection. Any browser's "view-source:"
       URL, DevTools opened from the menu, or just `git clone`-ing the
       public repo bypasses this instantly. It only stops the casual
       right-click on non-technical visitors. Kept intentionally simple
       so it never interferes with normal use of the site.
       ========================================================= */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.ctrlKey && (k === 'u' || k === 's')) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
      if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) e.preventDefault();
    });

    /* =========================================================
       INIT
       ========================================================= */
    renderSidebar();
    renderChat();
    try { history.replaceState(currentStateSnapshot(), ''); } catch (e) { /* ignore if History API unavailable */ }
  </script>
</body>

</html>
