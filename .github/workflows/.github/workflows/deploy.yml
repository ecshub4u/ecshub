name: Sync Study Material & Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ecshub-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Website Updater
        run: python update.py

      - name: Commit Generated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "auto: sync website data [skip ci]"
          fi

      - name: Rebase Onto Latest Main
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push Generated State
        run: |
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Production Site
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='update.py' \
            --exclude='_site/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
