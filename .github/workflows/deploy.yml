name: Sync Study Material & Deploy Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ecshub-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Update index.html and sitemap.xml
      - name: Run Website Updater
        run: python update.py

      # 4. Commit generated changes locally
      - name: Commit Generated Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "auto: sync website data [skip ci]"
          fi

      # 5. Get the latest main branch and rebase
      - name: Rebase Onto Latest Main
        run: |
          git fetch origin main
          git rebase origin/main

      # 6. Push the final generated state
      - name: Push Generated State
        run: |
          git push origin HEAD:main

      # 7. Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 8. Prepare a clean production website
      - name: Prepare Production Site
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='update.py' \
            --exclude='_site/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ _site/

      # 9. Upload the production site as Pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      # 10. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
