name: Update ECSHub and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "ecshub-deploy"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 3. Regenerate index.html's fileTree and sitemap.xml from the
      #    current folders. Safe to run on every push, not just ones that
      #    touched a year folder — it's fast, and it's a no-op commit if
      #    nothing actually changed.
      - name: Run ECSHub updater
        run: python update.py

      # 4. Commit + push the generated files, only if something changed.
      #    "[skip ci]" in the message stops this commit from re-triggering
      #    this same workflow — without it, the bot's own push would kick
      #    off another run, which would kick off another commit, and so on.
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html sitemap.xml

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "auto: sync website data [skip ci]"
            git push origin HEAD:main
          fi

      # 5. Configure Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Build a clean production folder (excludes dev-only files)
      - name: Prepare production site
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='update.py' \
            --exclude='_site/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ _site/

      # 7. Upload it as the Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      # 8. Deploy — this is the ONLY deployment step in the whole
      #    pipeline now, so there's no more risk of two workflows
      #    racing to publish two different snapshots.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
