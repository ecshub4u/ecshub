main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px 48px}

.logo{font-weight:800;font-size:20px;color:var(--text)}.logo span{color:var(--teal)}

h1{font-size:30px;line-height:1.15;margin:22px 0 6px;letter-spacing:-.8px}h1 em{font-style:normal;background:linear-gradient(90deg,#00a884,#ff6b9d,#ffb703,#00a884);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}@keyframes shine{to{background-position:200%}}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}

.search:focus-within{box-shadow:0 0 0 3px rgba(0,168,132,.35)}
.search input{flex:1;border:0;outline:0;background:none;font-size:16px;color:var(--text)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;text-transform:uppercase}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:14px}

.seg button.on{background:linear-gradient(135deg,#00a884,#2ec4b6);color:#fff;box-shadow:0 3px 8px rgba(0,168,132,.35)}
.resume{display:none;width:100%;text-align:left;border:0;background:linear-gradient(90deg,#ffe3ec,#fff1c9);color:#3a2a1a;border-radius:16px;padding:13px 14px;margin-bottom:16px;font-size:14px}
.resume b{color:var(--teal)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{position:relative;display:block;width:100%;border:0;background:var(--card);color:var(--text);text-align:left;padding:14px;border-radius:20px;box-shadow:0 6px 18px rgba(60,30,90,.1);font-size:15px;overflow:hidden;animation:up .45s both;transition:transform .2s}.row::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:hsl(var(--h,160) 85% 58%)}.row::after{content:"";position:absolute;right:-28px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:hsl(var(--h,160) 85% 58%/.16)}@keyframes up{from{opacity:0;transform:translateY(16px)}}
.row:active{transform:scale(.96) rotate(-1deg)}.row:hover .e{transform:rotate(-12deg) scale(1.12)}
.row .e{width:44px;height:44px;border-radius:14px;background:hsl(var(--h,160) 90% 60%/.2);display:grid;place-items:center;font-size:24px;margin-bottom:10px;transition:transform .3s}
.row .t{position:relative;font-weight:700;font-size:14.5px;line-height:1.25}.row small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}
.row .c{display:none}
.empty{grid-column:1/-1;padding:28px;text-align:center;color:var(--muted)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet.open{display:flex}
.panel{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .25s ease-out}

.panel h2 img{width:22px;height:22px;vertical-align:-4px;margin-right:4px}

Object.keys(D).forEach(function(y){Object.keys(D[y]).forEach(function(m){D[y][m].forEach(function(s){SUBN[s[2]]=s[0]})})});
function tot(k){var n=0;CATS.forEach(function(c){n+=(T[k][c[0]]||[]).length});return n}
var AL=[['dbms','database|relational'],['rdbms','relational'],['os','operating'],['ds','data structures|ds and dbms'],['cn','networks'],['oop','c\\+\\+'],['oops','c\\+\\+'],['cpp','c\\+\\+'],['se','software engineering'],['stats','statistics'],['math','discrete|numerical'],['maths','discrete|numerical'],['evs','environment'],['py','python']];
function subjMatch(n,t){n=n.toLowerCase();if(n.indexOf(t)>-1)return true;return AL.some(function(a){return a[0]===t&&new RegExp(a[1]).test(n)})}
function fw(n){return n+(n==1?' file':' files')}
function seg(el,items,on,fn){el.innerHTML='';items.forEach(function(x){var b=document.createElement('button');b.textContent=x;b.setAttribute('aria-pressed',x===on);if(x===on)b.className='on';b.onclick=function(){fn(x)};el.appendChild(b)})}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},2200)}
function boom(x,y,set){for(var i=0;i<9;i++){var s=document.createElement('span');s.className='fly';s.textContent=set[i%set.length];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',(Math.random()*200-100)+'px');s.style.setProperty('--y',(Math.random()*-170-20)+'px');s.style.setProperty('--r',(Math.random()*300)+'deg');document.body.appendChild(s);setTimeout(function(){s.remove()},1000)}}
var DONE={};try{DONE=JSON.parse(ST('eh_done')||'{}')}catch(e){}
function fid(k,f){return k+'|'+f[1]+'|'+f[0]}
function vib(n){try{navigator.vibrate&&navigator.vibrate(n||8)}catch(e){}}
function hl(t,term){var i=term&&term.length>1?t.toLowerCase().indexOf(term):-1;return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+term.length))+'</mark>'+esc(t.slice(i+term.length))}
function prog(k){var n=0,t=0;CATS.forEach(function(c){(T[k][c[0]]||[]).forEach(function(f){t++;if(DONE[fid(k,f)])n++})});return [n,t]}
function fileRow(f,cap,key,term){var c=EXT[f[2]]||'#64748b',sub=cap||f[1],id=fid(key,f);return '<div class="fi"><button class="fm"><span class="ft" style="background:'+c+'">'+esc(f[2].toUpperCase().slice(0,4))+'</span><span class="n">'+hl(pn(f[0]),term)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></button><button class="ck'+(DONE[id]?' on':'')+'" data-id="'+esc(id)+'" data-k="'+esc(key)+'" aria-pressed="'+(DONE[id]?'true':'false')+'" aria-label="Padh liya: '+esc(pn(f[0]))+'">✓</button></div>'}
function bindFiles(root){root.querySelectorAll('.fm').forEach(function(b){b.onclick=function(){vib();toast('Real site mein yeh file khulegi 📂')}});root.querySelectorAll('.ck').forEach(function(b){b.onclick=function(e){var id=b.dataset.id,on=!DONE[id];if(on)DONE[id]=1;else delete DONE[id];SV('eh_done',JSON.stringify(DONE));b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);vib(on?[10,30,10]:6);if(on){var k=b.dataset.k,p=prog(k);if(p[0]===p[1]){boom(e.clientX,e.clientY,['🎉','🏆','⭐','✨']);toast('🎉 '+SUBN[k]+' complete! Kya baat hai!')}else toast('Shabash! '+p[0]+'/'+p[1]+' ho gaye 💪')}}})}
function renderOpts(){var s=cur;var h='';CATS.forEach(function(c){var a=T[s[2]][c[0]]||[],n=a.length,dc=a.filter(function(f){return DONE[fid(s[2],f)]}).length;if(n)h+='<button class="opt" data-c="'+c[0]+'" style="--oh:'+c[3]+'"><span>'+c[1]+'</span>'+c[2]+'<small>'+fw(n)+(dc?' · '+dc+' ✓':'')+'</small></button>'});
$('opts').innerHTML=h;document.querySelectorAll('#opts .opt').forEach(function(o){o.onclick=function(){showFiles(o.dataset.c)}});
}
function openSub(s,y,m){cur=s;var lg=LOGO(s[0]);$('sn').innerHTML=(lg||esc(s[1]))+' '+esc(s[0]);$('ss').textContent=y+' · '+m+' · '+fw(tot(s[2]))+(prog(s[2])[0]?' · '+prog(s[2])[0]+' ✓':'');
renderOpts();
$('v1').style.display='block';$('v2').style.display='none';openSheet()}
function showFiles(c){var a=T[cur[2]][c]||[],ct=CATS.filter(function(x){return x[0]==c})[0];$('fn').textContent=ct[1]+' '+ct[2];$('fs').textContent=cur[0]+' · '+fw(a.length);
$('fl').innerHTML=a.map(function(f){return fileRow(f,'',cur[2])}).join('');bindFiles($('fl'));$('fl').scrollTop=0;$('v1').style.display='none';$('v2').style.display='block'}
function openSheet(){$('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';try{if(location.hash!=='#open')location.hash='open'}catch(e){}setTimeout(function(){try{$('close').focus({preventScroll:true})}catch(e){}},60)}
function closeSheet(){if(!$('sheet').classList.contains('open'))return;if(location.hash==='#open'){history.back();return}hideSheet()}
function hideSheet(){$('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true');document.body.style.overflow='';NA=1;render();NA=0;var rr=RI>-1&&!$('q').value?$('list').children[RI]:null;if(rr)try{rr.focus({preventScroll:true})}catch(e){}}
window.addEventListener('hashchange',function(){if(location.hash!=='#open'&&$('sheet').classList.contains('open'))hideSheet()});
function render(){
var term=$('q').value.trim().toLowerCase(),rows=[];
$('pick').style.display=term?'none':'block';
if(!term){seg($('years'),Object.keys(D),Y,function(v){Y=v;S=Object.keys(D[Y])[0];SV('eh_y',Y);SV('eh_s',S);render()});seg($('sems'),Object.keys(D[Y]),S,function(v){S=v;SV('eh_s',S);render()});
D[Y][S].forEach(function(s){rows.push([s,Y,S])})}
else Object.keys(D).forEach(function(y){Object.keys(D[y]).forEach(function(m){D[y][m].forEach(function(s){if(subjMatch(s[0],term))rows.push([s,y,m])})})});
var fh='',fc=0;
if(term.length>1){var res=[];Object.keys(T).forEach(function(k){CATS.forEach(function(c){(T[k][c[0]]||[]).forEach(function(f){if((pn(f[0])+' '+f[1]).toLowerCase().indexOf(term)>-1)res.push([f,k,c[2]])})})});
fc=res.length;res.slice(0,15).forEach(function(r){fh+=fileRow(r[0],SUBN[r[1]]+' · '+r[2],r[1],term)})}
$('fcnt').textContent=fc?'Files · '+fc+(fc>15?' (top 15 dikha rahe hain)':''):'';
$('files').innerHTML=fh?'<div class="fcard">'+fh+'</div>':'';bindFiles($('files'));
$('cnt').textContent=term?(rows.length?'Subjects · '+rows.length:''):rows.length?Y+' · '+S+' · '+rows.length+(rows.length==1?' subject':' subjects'):'';
var L=$('list');L.innerHTML=(rows.length||fc)?'':!term?'<div class="empty">'+Y+' ka material jaldi aayega 🌱<br>Tab tak baaki years dekh lo!</div>':'<div class="empty">Kuch nahi mila 😅<br>Spelling check karo, ya try karo: <b>python</b>, <b>set a</b>, <b>unit 1</b></div>';
rows.forEach(function(r,i){var s=r[0],lg=LOGO(s[0]),p=prog(s[2]),b=document.createElement('button');b.className='row';if(NA)b.style.animation='none';b.style.setProperty('--h',(i*47+150)%360);b.style.animationDelay=(i*35)+'ms';
b.innerHTML='<div class="e'+(lg?' lg':'')+'">'+(lg||s[1])+'</div><div class="t">'+hl(s[0],term)+'<small>'+(term?r[1]+' · '+r[2]:fw(p[1])+(p[1]&&p[0]==p[1]?' · complete ✅':p[0]?' · '+p[0]+' done':''))+'</small></div><i class="pb" style="width:'+(p[1]?Math.round(p[0]*100/p[1]):0)+'%"></i>';
b.onclick=function(e){vib();RI=i;boom(e.clientX,e.clientY,[s[1],'✨','⭐']);openSub(s,r[1],r[2])};L.appendChild(b)})}
var qt;$('q').oninput=function(){$('clr').hidden=!$('q').value;clearTimeout(qt);qt=setTimeout(render,70)};

$('streak').textContent='🔥 '+st;$('streak').onclick=function(e){boom(e.clientX,e.clientY,['🔥','💪','⭐']);toast(st+' din ki study streak! Todna mat 😎')};
var lc=0,lt;$('logo').onclick=function(){lc++;clearTimeout(lt);lt=setTimeout(function(){lc=0},900);vib();if(lc>=5){lc=0;for(var i=0;i<4;i++)boom(innerWidth/2,innerHeight/2,['🎓','❤️','⭐','📚']);toast('Made with ❤️ by Rohan, ECS dosto ke liye 🎓')}};
(function(){var p=document.querySelector('.panel'),y0=null,dy=0;p.addEventListener('touchstart',function(e){if(e.target.closest('#fl')&&$('fl').scrollTop>0){y0=null;return}y0=e.touches[0].clientY;dy=0;p.style.transition='none'},{passive:true});
